<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso Restrito - Painel Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-card {
      background-color: #1e293b;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    h2 { margin-bottom: 20px; color: #f8fafc; }
    input[type="password"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #334155;
      border-radius: 6px;
      background-color: #0f172a;
      color: #fff;
      font-size: 1rem;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background-color: #1d4ed8; }
    .error-msg { color: #ef4444; margin-top: 15px; display: none; }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>Acesso ao Painel</h2>
    <form id="login-form">
      <input type="password" id="senha" placeholder="Digite a senha" required>
      <button type="submit">Entrar</button>
    </form>
    <div id="error-msg" class="error-msg">Senha incorreta!</div>
  </div>

  <script>
    // DEFINE A SUA SENHA DE ACESSO AQUI:
    const SENHA_CORRETA = "123456";

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const senhaInput = document.getElementById('senha').value;

      if (senhaInput === SENHA_CORRETA) {
        // Salva a sessão no navegador para liberar o acesso ao admin.html
        sessionStorage.setItem('admin_autenticado', 'true');
        window.location.href = 'admin.html';
      } else {
        document.getElementById('error-msg').style.display = 'block';
      }
    });
  </script>
</body>
</html>
