<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin - Controle de Mídias e TVs</title>
  
  <script>
    // Verificação de autenticação no início do carregamento
    if (sessionStorage.getItem('admin_autenticado') !== 'true') {
      window.location.replace('./senha.html');
    }
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f1f5f9;
      color: #334155;
      padding: 20px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .btn-logout {
      background-color: #64748b;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .card {
      background: #fff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      margin-bottom: 25px;
    }
    h2 { margin-bottom: 15px; color: #0f172a; font-size: 1.25rem; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; }
    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 1rem;
    }
    .inline-form { display: flex; gap: 10px; }
    .inline-form input { flex: 1; }
    button.btn-primary {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }
    button.btn-primary:hover { background-color: #1d4ed8; }
    .media-list { list-style: none; }
    .media-item {
      background: #fff;
      border: 1px solid #e2e8f0;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .media-info strong { display: block; color: #0f172a; word-break: break-all; }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      font-size: 0.8rem;
      border-radius: 4px;
      background: #e2e8f0;
      color: #475569;
      margin-top: 5px;
      margin-right: 5px;
    }
    .badge-tv { background: #dbeafe; color: #1e40af; font-weight: bold; }
    .btn-delete {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>

  <!-- SDKs do Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="config.js"></script>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Gerenciador de Mídias</h1>
      <button class="btn-logout" onclick="logout()">Sair</button>
    </div>

    <!-- Cadastrar TV -->
    <div class="card">
      <h2>1. Cadastrar Nova TV</h2>
      <form id="tv-form">
        <div class="form-group inline-form">
          <input type="text" id="nomeTv" placeholder="Ex: TV Recepção, TV Salão, TV Loja" required>
          <button type="submit" class="btn-primary" style="width: auto; padding: 0 20px;">Adicionar TV</button>
        </div>
      </form>
    </div>

    <!-- Cadastrar Mídia -->
    <div class="card">
      <h2>2. Cadastrar Mídia na Playlist</h2>
      <form id="media-form">
        <div class="form-group">
          <label for="url">URL da Mídia (Imagem ou Vídeo MP4):</label>
          <input type="text" id="url" placeholder="https://exemplo.com/imagem.jpg" required>
        </div>

        <div class="form-group">
          <label for="tipo">Tipo de Mídia:</label>
          <select id="tipo">
            <option value="imagem">Imagem</option>
            <option value="video">Vídeo MP4</option>
          </select>
        </div>

        <div class="form-group">
          <label for="tempo">Tempo de Exibição (em segundos):</label>
          <input type="number" id="tempo" value="10" min="1" required>
        </div>

        <div class="form-group">
          <label for="tvAlvo">Destino (Qual TV vai exibir?):</label>
          <select id="tvAlvo">
            <option value="todas">Todas as TVs</option>
          </select>
        </div>

        <button type="submit" class="btn-primary">Salvar Mídia</button>
      </form>
    </div>

    <!-- Lista de Mídias -->
    <h2>Mídias Cadastradas</h2>
    <ul id="media-list" class="media-list"></ul>
  </div>

  <script>
    const tvSelect = document.getElementById('tvAlvo');
    const mediaListContainer = document.getElementById('media-list');

    // Cadastrar TV no Firebase
    document.getElementById('tv-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const nomeTv = document.getElementById('nomeTv').value.trim();
      const idTv = nomeTv.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');

      database.ref('tvs/' + idTv).set({
        nome: nomeTv
      }).then(() => {
        alert('TV cadastrada com sucesso!');
        document.getElementById('nomeTv').value = '';
      });
    });

    // Carregar Lista de TVs no <select>
    database.ref('tvs').on('value', (snapshot) => {
      tvSelect.innerHTML = '<option value="todas">Todas as TVs</option>';
      const data = snapshot.val();
      if (data) {
        Object.keys(data).forEach(id => {
          const option = document.createElement('option');
          option.value = id;
          option.textContent = data[id].nome;
          tvSelect.appendChild(option);
        });
      }
    });

    // Cadastrar Mídia
    document.getElementById('media-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const newMedia = {
        url: document.getElementById('url').value.trim(),
        tipo: document.getElementById('tipo').value,
        tempo: parseInt(document.getElementById('tempo').value, 10) || 10,
        tvAlvo: document.getElementById('tvAlvo').value
      };

      database.ref('playlist').push(newMedia).then(() => {
        alert('Mídia salva!');
        document.getElementById('media-form').reset();
        document.getElementById('tempo').value = 10;
      });
    });

    // Listar Mídias com opção de excluir
    database.ref('playlist').on('value', (snapshot) => {
      mediaListContainer.innerHTML = '';
      const data = snapshot.val();

      if (!data) {
        mediaListContainer.innerHTML = '<p>Nenhuma mídia cadastrada no momento.</p>';
        return;
      }

      Object.keys(data).forEach(key => {
        const item = data[key];
        const li = document.createElement('li');
        li.className = 'media-item';
        li.innerHTML = `
          <div class="media-info">
            <strong>${item.url}</strong>
            <span class="badge">Tipo: ${item.tipo}</span>
            <span class="badge">Tempo: ${item.tempo}s</span>
            <span class="badge badge-tv">TV: ${item.tvAlvo === 'todas' ? 'Todas as TVs' : item.tvAlvo}</span>
          </div>
          <button class="btn-delete" onclick="removerMidia('${key}')">Excluir</button>
        `;
        mediaListContainer.appendChild(li);
      });
    });

    function removerMidia(id) {
      if (confirm('Deseja excluir esta mídia?')) {
        database.ref('playlist').child(id).remove();
      }
    }

    function logout() {
      sessionStorage.removeItem('admin_autenticado');
      window.location.replace('./senha.html');
    }
  </script>
</body>
</html>
