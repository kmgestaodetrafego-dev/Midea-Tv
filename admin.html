<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de TV Mídia</title>
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    h1 {
      margin-bottom: 20px;
      color: #fff;
    }
    .card {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }
    .card h2 {
      margin-bottom: 15px;
      font-size: 1.2rem;
      color: #ffcc00;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.9rem;
      color: #aaa;
    }
    input, select {
      width: 100%;
      padding: 10px;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 4px;
      color: #fff;
      font-size: 1rem;
    }
    button {
      background: #e50914;
      color: #fff;
      border: none;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #b80710;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #333;
    }
    th {
      background: #252525;
      color: #aaa;
      font-size: 0.85rem;
      text-transform: uppercase;
    }
    .btn-delete {
      background: #d32f2f;
      padding: 6px 12px;
      font-size: 0.8rem;
    }
    .btn-delete:hover {
      background: #9a0007;
    }
    .badge-online {
      background: #00ff6622;
      color: #00ff66;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: bold;
    }
    .link-site {
      color: #00bfff;
      text-decoration: none;
      font-family: monospace;
      font-size: 0.9rem;
    }
    .link-site:hover {
      text-decoration: underline;
    }
  </style>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="config.js"></script>
</head>
<body>

  <div class="container">
    <h1>Gerenciador de TV Mídia</h1>

    <!-- MONITOR DE TVS ONLINE -->
    <div class="card">
      <h2>TVs Conectadas em Tempo Real</h2>
      <p style="font-size: 1.1rem; margin-bottom: 10px;">
        Total Online: <strong id="total-tvs-online" style="color: #00ff66;">0</strong>
      </p>

      <table>
        <thead>
          <tr>
            <th>ID da TV</th>
            <th>Página / Parâmetros</th>
            <th>URL Completa do Site</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="tabela-tvs-online">
          <tr>
            <td colspan="4" style="text-align: center; color: #888;">Buscando TVs conectadas...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- ADICIONAR MÍDIA -->
    <div class="card">
      <h2>Adicionar Mídia à Playlist</h2>
      <form id="media-form">
        <div class="form-group">
          <label for="url">URL da Mídia (Drive, Dropbox, Direta, etc):</label>
          <input type="text" id="url" required placeholder="https://...">
        </div>
        
        <div class="form-group">
          <label for="tipo">Tipo de Mídia:</label>
          <select id="tipo">
            <option value="imagem">Imagem</option>
            <option value="video">Vídeo</option>
          </select>
        </div>

        <div class="form-group">
          <label for="tempo">Tempo de Exibição (Segundos):</label>
          <input type="number" id="tempo" value="10" min="3" required>
        </div>

        <div class="form-group">
          <label for="tvAlvo">TV Alvo (ID da TV ou 'todas'):</label>
          <input type="text" id="tvAlvo" value="todas" placeholder="ex: todas, recepcao, sala1">
        </div>

        <button type="submit">Cadastrar Mídia</button>
      </form>
    </div>

    <!-- LISTA DE MÍDIAS CADASTRADAS -->
    <div class="card">
      <h2>Playlist Agendada</h2>
      <table>
        <thead>
          <tr>
            <th>Tipo</th>
            <th>URL</th>
            <th>Tempo</th>
            <th>TV Alvo</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="playlist-table">
          <tr>
            <td colspan="5" style="text-align: center; color: #888;">Carregando playlist...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const mediaForm = document.getElementById('media-form');
    const playlistTable = document.getElementById('playlist-table');
    const tabelaTvsOnline = document.getElementById('tabela-tvs-online');
    const totalTvsOnline = document.getElementById('total-tvs-online');

    // MONITORAR TVS ONLINE
    if (typeof database !== 'undefined') {
      database.ref('tvs_online').on('value', (snapshot) => {
        const tvs = snapshot.val();

        if (!tvs) {
          totalTvsOnline.innerText = '0';
          tabelaTvsOnline.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #888;">Nenhuma TV conectada no momento.</td></tr>';
          return;
        }

        const listaTvs = Object.values(tvs);
        totalTvsOnline.innerText = listaTvs.length;

        tabelaTvsOnline.innerHTML = listaTvs.map(tv => `
          <tr>
            <td style="font-weight: bold; color: #fff;">${tv.id}</td>
            <td style="color: #ffcc00; font-family: monospace;">${tv.pagina}</td>
            <td>
              <a href="${tv.urlCompleta}" target="_blank" class="link-site">
                ${tv.urlCompleta}
              </a>
            </td>
            <td><span class="badge-online">Online</span></td>
          </tr>
        `).join('');
      });

      // CADASTRAR NOVA MÍDIA
      mediaForm.addEventListener('submit', (e) => {
        e.preventDefault();

        const newMedia = {
          url: document.getElementById('url').value,
          tipo: document.getElementById('tipo').value,
          tempo: document.getElementById('tempo').value,
          tvAlvo: document.getElementById('tvAlvo').value || 'todas',
          criadoEm: firebase.database.ServerValue.TIMESTAMP
        };

        database.ref('playlist').push(newMedia).then(() => {
          mediaForm.reset();
          document.getElementById('tempo').value = 10;
          document.getElementById('tvAlvo').value = 'todas';
        });
      });

      // LISTAR MÍDIAS CADASTRADAS
      database.ref('playlist').on('value', (snapshot) => {
        const data = snapshot.val();
        playlistTable.innerHTML = '';

        if (!data) {
          playlistTable.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #888;">Nenhuma mídia cadastrada.</td></tr>';
          return;
        }

        Object.keys(data).forEach(key => {
          const item = data[key];
          const tr = document.createElement('tr');

          tr.innerHTML = `
            <td style="text-transform: capitalize;">${item.tipo}</td>
            <td style="max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${item.url}</td>
            <td>${item.tempo}s</td>
            <td>${item.tvAlvo || 'todas'}</td>
            <td>
              <button class="btn-delete" onclick="removerMidia('${key}')">Excluir</button>
            </td>
          `;
          playlistTable.appendChild(tr);
        });
      });
    }

    function removerMidia(id) {
      if (confirm('Deseja realmente remover esta mídia?')) {
        database.ref('playlist/' + id).remove();
      }
    }
  </script>
</body>
</html>
