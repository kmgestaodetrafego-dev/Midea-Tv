<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Midea TV - Gerenciador de Mídias</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #1a2a3a;
    }
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
    }
    input[type="text"], input[type="number"], input[type="time"], select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1rem;
    }
    .time-row {
      display: flex;
      gap: 15px;
    }
    .time-row .form-group {
      flex: 1;
    }
    button {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 1rem;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #218838;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th {
      background-color: #f8f9fa;
    }
    .btn-delete {
      background-color: #dc3545;
      padding: 6px 12px;
      font-size: 0.85rem;
      width: auto;
    }
    .btn-delete:hover {
      background-color: #c82333;
    }
    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      color: #fff;
      font-weight: bold;
    }
    .badge-imagem { background-color: #17a2b8; }
    .badge-video { background-color: #ffc107; color: #000; }
  </style>

  <!-- SDKs do Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="config.js"></script>
</head>
<body>

  <div class="container">
    <h1>📺 Gestão da Tela Midea TV</h1>

    <!-- Cadastrar Mídia -->
    <div class="card">
      <h2>Adicionar Nova Mídia</h2>
      <form id="media-form">
        <div class="form-group">
          <label for="url">URL da Mídia (Imagem, YouTube, Google Drive ou Dropbox):</label>
          <input type="text" id="url" placeholder="https://..." required>
        </div>

        <div class="form-group">
          <label for="tipo">Tipo de Mídia:</label>
          <select id="tipo">
            <option value="imagem">Imagem</option>
            <option value="video">Vídeo</option>
          </select>
        </div>

        <div class="form-group">
          <label for="tempo">Tempo de Exibição (em segundos):</label>
          <input type="number" id="tempo" value="10" min="1" required>
        </div>

        <div class="time-row">
          <div class="form-group">
            <label for="horaInicio">Horário de Início (opcional):</label>
            <input type="time" id="horaInicio">
          </div>
          <div class="form-group">
            <label for="horaFim">Horário de Fim (opcional):</label>
            <input type="time" id="horaFim">
          </div>
        </div>

        <button type="submit">Cadastrar na TV</button>
      </form>
    </div>

    <!-- Lista de Mídias Cadastradas -->
    <div class="card">
      <h2>Mídias Cadastradas</h2>
      <table>
        <thead>
          <tr>
            <th>Tipo</th>
            <th>URL</th>
            <th>Duração</th>
            <th>Horário Agendado</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="playlist-table">
          <tr><td colspan="5">Carregando lista...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const mediaForm = document.getElementById('media-form');
    const playlistTable = document.getElementById('playlist-table');

    // Cadastrar mídia no Firebase
    mediaForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const url = document.getElementById('url').value.trim();
      const tipo = document.getElementById('tipo').value;
      const tempo = parseInt(document.getElementById('tempo').value, 10);
      const horaInicio = document.getElementById('horaInicio').value || null;
      const horaFim = document.getElementById('horaFim').value || null;

      database.ref('playlist').push({
        url: url,
        tipo: tipo,
        tempo: tempo,
        horaInicio: horaInicio,
        horaFim: horaFim,
        createdAt: firebase.database.ServerValue.TIMESTAMP
      }).then(() => {
        alert('Mídia cadastrada com sucesso!');
        mediaForm.reset();
        document.getElementById('tempo').value = 10;
      }).catch((error) => {
        alert('Erro ao cadastrar: ' + error.message);
      });
    });

    // Listar mídias cadastradas em tempo real
    database.ref('playlist').on('value', (snapshot) => {
      const data = snapshot.val();
      playlistTable.innerHTML = '';

      if (!data) {
        playlistTable.innerHTML = '<tr><td colspan="5">Nenhuma mídia cadastrada no momento.</td></tr>';
        return;
      }

      Object.keys(data).forEach((key) => {
        const item = data[key];
        const tr = document.createElement('tr');

        const horastr = (item.horaInicio && item.horaFim) 
          ? `${item.horaInicio} até ${item.horaFim}` 
          : 'O dia todo';

        tr.innerHTML = `
          <td><span class="badge badge-${item.tipo}">${item.tipo.toUpperCase()}</span></td>
          <td style="max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
            <a href="${item.url}" target="_blank">${item.url}</a>
          </td>
          <td>${item.tempo}s</td>
          <td>${horastr}</td>
          <td>
            <button class="btn-delete" onclick="deleteMedia('${key}')">Excluir</button>
          </td>
        `;

        playlistTable.appendChild(tr);
      });
    });

    // Excluir mídia do Firebase
    window.deleteMedia = function(key) {
      if (confirm('Tem certeza que deseja remover esta mídia da exibição?')) {
        database.ref('playlist').child(key).remove();
      }
    };
  </script>
</body>
</html>
