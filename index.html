<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Midea TV - Exibição de Mídias</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #display-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background-color: #000;
    }

    .media-element {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border: none;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Animação Suave de Transição (Fade In) */
    .fade-in {
      animation: fadeInEffect 1.2s ease-in-out forwards;
    }

    @keyframes fadeInEffect {
      0% {
        opacity: 0;
        transform: scale(1.02);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Mensagem de Status / Carregamento */
    #status-msg {
      color: #ffffff;
      font-size: 1.5rem;
      text-align: center;
      z-index: 10;
      padding: 20px;
    }
  </style>

  <!-- SDKs do Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="config.js"></script>
</head>
<body>

  <div id="display-container">
    <div id="status-msg">Carregando mídias do Firebase...</div>
  </div>

  <script>
    const container = document.getElementById('display-container');
    let playlist = [];
    let currentIndex = 0;
    let timer = null;

    // --- Formatação Automática de Links (Dropbox e Google Drive) ---
    function formatUrl(url) {
      if (!url) return '';
      
      // Ajuste para Dropbox
      if (url.includes('dropbox.com')) {
        return url.replace('dl=0', 'raw=1').replace('dl=1', 'raw=1');
      }
      
      // Ajuste para exibição/embed do Google Drive
      if (url.includes('drive.google.com') && url.includes('/view')) {
        return url.replace('/view', '/preview');
      }

      return url;
    }

    // --- Conexão e Escuta do Firebase ---
    if (typeof database !== 'undefined') {
      
      // Indicador de Presença Online
      const myPresenceRef = database.ref('online_users').push();
      myPresenceRef.set(true);
      myPresenceRef.onDisconnect().remove();

      // Atualização em tempo real da lista
      database.ref('playlist').on('value', (snapshot) => {
        const data = snapshot.val();
        playlist = [];

        if (data) {
          Object.keys(data).forEach(key => {
            playlist.push(data[key]);
          });
        }

        if (playlist.length > 0) {
          if (currentIndex >= playlist.length) {
            currentIndex = 0;
          }
          showCurrentMedia();
        } else {
          clearTimeout(timer);
          container.innerHTML = '<div id="status-msg">Nenhuma mídia cadastrada no momento.</div>';
        }
      }, (error) => {
        console.error("Erro ao ler do Firebase:", error);
        container.innerHTML = '<div id="status-msg">Erro de conexão com o Firebase. Verifique o config.js</div>';
      });

    } else {
      container.innerHTML = '<div id="status-msg">Erro: config.js não encontrado ou Firebase não configurado.</div>';
    }

    // --- Exibição Principal com Animação Fade-In ---
    function showCurrentMedia() {
      clearTimeout(timer);

      if (playlist.length === 0) return;

      const item = playlist[currentIndex];
      const duration = (item.tempo || 10) * 1000;
      const formattedUrl = formatUrl(item.url);

      // Limpa a tela
      container.innerHTML = '';

      if (item.tipo === 'imagem') {
        const img = document.createElement('img');
        img.src = formattedUrl;
        img.className = 'media-element fade-in';
        img.alt = 'Mídia em exibição';
        img.onerror = () => nextMedia();
        container.appendChild(img);

      } else if (item.tipo === 'video') {
        
        // Se for YouTube ou Google Drive (Iframe)
        if (formattedUrl.includes('youtube.com') || formattedUrl.includes('youtu.be') || formattedUrl.includes('drive.google.com')) {
          const iframe = document.createElement('iframe');
          iframe.src = formattedUrl;
          iframe.className = 'media-element fade-in';
          iframe.allow = "autoplay; encrypted-media; fullscreen";
          iframe.allowFullscreen = true;
          container.appendChild(iframe);

        } else {
          // Se for vídeo MP4 nativo / Dropbox
          const video = document.createElement('video');
          video.src = formattedUrl;
          video.className = 'media-element fade-in';
          video.autoplay = true;
          video.muted = true; // Muted é obrigatório para Autoplay em navegadores
          video.playsInline = true;
          video.controls = false;

          video.play().catch(err => {
            console.warn("Autoplay bloqueado pelo navegador:", err);
          });

          video.onerror = () => {
            console.error("Erro ao carregar o vídeo:", formattedUrl);
            nextMedia();
          };

          container.appendChild(video);
        }
      }

      // Agendamento do tempo da próxima mídia
      timer = setTimeout(() => {
        nextMedia();
      }, duration);
    }

    function nextMedia() {
      if (playlist.length === 0) return;
      currentIndex = (currentIndex + 1) % playlist.length;
      showCurrentMedia();
    }
  </script>
</body>
</html>
