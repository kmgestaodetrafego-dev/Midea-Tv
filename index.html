<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player da TV</title>
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
    }
    #display-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    /* Duas camadas fixas */
    .layer {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      transition: opacity 1.2s ease-in-out;
      z-index: 1;
      pointer-events: none;
    }
    .layer.active {
      opacity: 1 !important;
      z-index: 2 !important;
    }
    .layer img, .layer video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    #status-msg {
      color: #fff;
      font-size: 1.5rem;
      text-align: center;
      padding: 20px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      background: rgba(0,0,0,0.7);
      border-radius: 8px;
    }
  </style>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="config.js"></script>
</head>
<body>

  <div id="display-container">
    <div id="layer-a" class="layer"></div>
    <div id="layer-b" class="layer"></div>
    <div id="status-msg">Carregando mídias...</div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const MINHA_TV_ID = urlParams.get('tv') || 'todas';

    const layerA = document.getElementById('layer-a');
    const layerB = document.getElementById('layer-b');
    const statusMsg = document.getElementById('status-msg');

    let playlist = [];
    let currentIndex = 0;
    let timer = null;
    let activeLayer = layerA;
    let inactiveLayer = layerB;
    let isTransitioning = false;

    // Converte links do Dropbox e Google Drive
    function formatUrl(url, tipo) {
      if (!url) return '';
      let clean = url.trim();

      if (clean.includes('dropbox.com') || clean.includes('dropboxusercontent.com')) {
        try {
          let parsedUrl = new URL(clean);
          parsedUrl.hostname = 'dl.dropboxusercontent.com';
          parsedUrl.searchParams.set('raw', '1');
          parsedUrl.searchParams.delete('dl');
          return parsedUrl.toString();
        } catch (e) {
          return clean;
        }
      }

      if (clean.includes('drive.google.com') || clean.includes('docs.google.com')) {
        const idMatch = clean.match(/\/d\/([a-zA-Z0-9_-]+)/) || clean.match(/[?&]id=([a-zA-Z0-9_-]+)/);
        if (idMatch && idMatch[1]) {
          const id = idMatch[1];
          return tipo === 'imagem' 
            ? `https://lh3.googleusercontent.com/d/${id}`
            : `https://docs.google.com/uc?export=download&id=${id}`;
        }
      }

      return clean;
    }

    if (typeof database !== 'undefined') {
      database.ref('playlist').on('value', (snapshot) => {
        const data = snapshot.val();
        const todasMidias = data ? Object.values(data) : [];

        playlist = todasMidias.filter(item => {
          return !item.tvAlvo || item.tvAlvo === 'todas' || item.tvAlvo === MINHA_TV_ID;
        });

        if (playlist.length > 0) {
          if (!activeLayer.children.length && !inactiveLayer.children.length) {
            showMedia();
          }
        } else {
          clearTimeout(timer);
          statusMsg.style.display = 'block';
          statusMsg.innerText = `Nenhuma mídia agendada para esta TV (${MINHA_TV_ID}).`;
        }
      }, (error) => {
        console.error("Erro no Firebase Database:", error);
        statusMsg.innerText = "Erro ao carregar dados do Firebase.";
      });
    } else {
      statusMsg.innerText = "Erro: arquivo config.js não encontrado.";
    }

    function showMedia() {
      clearTimeout(timer);
      isTransitioning = false;

      if (playlist.length === 0) return;
      if (currentIndex >= playlist.length) currentIndex = 0;

      const item = playlist[currentIndex];
      const duration = (parseInt(item.tempo, 10) || 10) * 1000;
      const finalUrl = formatUrl(item.url, item.tipo);

      console.log(`Carregando [${item.tipo}]:`, finalUrl);

      // Prepara a camada inativa para receber a nova mídia
      inactiveLayer.innerHTML = '';
      let newElement;

      if (item.tipo === 'imagem') {
        newElement = document.createElement('img');
        newElement.src = finalUrl;
        
        newElement.onload = () => switchLayers(newElement, duration);
        newElement.onerror = () => {
          console.error("Erro na imagem (avançando):", finalUrl);
          nextMedia();
        };
        inactiveLayer.appendChild(newElement);

      } else {
        newElement = document.createElement('video');
        newElement.muted = true;
        newElement.defaultMuted = true;
        newElement.setAttribute('muted', '');
        newElement.setAttribute('playsinline', '');
        newElement.setAttribute('webkit-playsinline', '');
        newElement.autoplay = true;
        newElement.preload = 'auto';

        let started = false;

        const startPlayback = () => {
          if (started) return;
          started = true;

          const playPromise = newElement.play();
          if (playPromise !== undefined) {
            playPromise.then(() => {
              switchLayers(newElement, duration);
            }).catch(() => {
              newElement.muted = true;
              newElement.play().then(() => {
                switchLayers(newElement, duration);
              }).catch(() => {
                console.error("Erro ao dar play no vídeo. Pulando...");
                nextMedia();
              });
            });
          } else {
            switchLayers(newElement, duration);
          }
        };

        newElement.onloadeddata = startPlayback;
        newElement.oncanplay = startPlayback;

        newElement.onerror = () => {
          console.error("Erro no vídeo (pulando):", finalUrl);
          nextMedia();
        };

        newElement.src = finalUrl;
        inactiveLayer.appendChild(newElement);

        setTimeout(() => {
          if (!started) {
            console.warn("Timeout do vídeo. Avançando...");
            nextMedia();
          }
        }, 12000);
      }
    }

    function switchLayers(newElement, duration) {
      if (isTransitioning) return;
      isTransitioning = true;

      statusMsg.style.display = 'none';

      // Ativa a nova camada e desativa a anterior
      inactiveLayer.classList.add('active');
      activeLayer.classList.remove('active');

      // Troca as referências de ativa/inativa
      const temp = activeLayer;
      activeLayer = inactiveLayer;
      inactiveLayer = temp;

      // Limpa totalmente a camada que acabou de ir para o fundo após a animação
      setTimeout(() => {
        const oldVideo = inactiveLayer.querySelector('video');
        if (oldVideo) {
          oldVideo.pause();
          oldVideo.removeAttribute('src');
          oldVideo.load();
        }
        inactiveLayer.innerHTML = '';
      }, 1300);

      clearTimeout(timer);
      timer = setTimeout(nextMedia, duration);
    }

    function nextMedia() {
      clearTimeout(timer);
      if (playlist.length > 0) {
        currentIndex = (currentIndex + 1) % playlist.length;
      }
      showMedia();
    }
  </script>
</body>
</html>
