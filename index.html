<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player da TV</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
    }
    #display-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .media-element {
      width: 100%;
      height: 100%;
      object-fit: contain;
      position: absolute;
      top: 0; left: 0;
    }
    #status-msg { color: #fff; font-size: 1.5rem; text-align: center; padding: 20px; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="config.js"></script>
</head>
<body>

  <div id="display-container">
    <div id="status-msg">Carregando mídias...</div>
  </div>

  <script>
    // Identifica qual TV é esta pelo parâmetro ?tv= na URL (Ex: index.html?tv=tv-recepcao)
    const urlParams = new URLSearchParams(window.location.search);
    const MINHA_TV_ID = urlParams.get('tv') || 'todas';

    const container = document.getElementById('display-container');
    let playlist = [];
    let currentIndex = 0;
    let timer = null;

    function formatUrl(url) {
      if (!url) return '';
      let clean = url.trim();
      if (clean.includes('dropbox.com')) return clean.replace('dl=0', 'raw=1').replace('dl=1', 'raw=1');
      if (clean.includes('drive.google.com')) {
        const match = clean.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (match && match[1]) return `https://drive.google.com/uc?export=view&id=${match[1]}`;
      }
      return clean;
    }

    if (typeof database !== 'undefined') {
      database.ref('playlist').on('value', (snapshot) => {
        const data = snapshot.val();
        const todasMidias = data ? Object.values(data) : [];

        // Filtra para exibir mídias destinadas a TODAS as TVs ou para esta TV específica
        playlist = todasMidias.filter(item => {
          return !item.tvAlvo || item.tvAlvo === 'todas' || item.tvAlvo === MINHA_TV_ID;
        });

        if (playlist.length > 0) {
          showMedia();
        } else {
          clearTimeout(timer);
          container.innerHTML = `<div id="status-msg">Nenhuma mídia agendada para este dispositivo (${MINHA_TV_ID}).</div>`;
        }
      });
    } else {
      container.innerHTML = '<div id="status-msg">Erro: config.js não encontrado.</div>';
    }

    function showMedia() {
      clearTimeout(timer);
      if (playlist.length === 0) return;
      if (currentIndex >= playlist.length) currentIndex = 0;

      const item = playlist[currentIndex];
      const duration = (parseInt(item.tempo, 10) || 10) * 1000;
      const finalUrl = formatUrl(item.url);

      container.innerHTML = '';

      if (item.tipo === 'imagem') {
        const img = document.createElement('img');
        img.className = 'media-element';
        img.src = finalUrl;
        img.onerror = () => nextMedia();
        container.appendChild(img);
      } else {
        const video = document.createElement('video');
        video.className = 'media-element';
        video.src = finalUrl;
        video.autoplay = true;
        video.muted = true;
        video.playsInline = true;
        video.onerror = () => nextMedia();
        container.appendChild(video);
      }

      timer = setTimeout(nextMedia, duration);
    }

    function nextMedia() {
      if (playlist.length > 0) {
        currentIndex = (currentIndex + 1) % playlist.length;
      }
      showMedia();
    }
  </script>
</body>
</html>
