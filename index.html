<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Midea TV - Player de Exibição</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #display-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background-color: #000;
    }

    .media-element {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border: none;
      position: absolute;
      top: 0;
      left: 0;
    }

    .fade-in {
      animation: fadeInEffect 0.8s ease-in-out forwards;
    }

    @keyframes fadeInEffect {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    #status-msg {
      color: #ffffff;
      font-size: 1.5rem;
      text-align: center;
      z-index: 10;
      padding: 20px;
    }
  </style>

  <!-- SDKs do Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="config.js"></script>
</head>
<body>

  <div id="display-container">
    <div id="status-msg">Carregando mídias do Firebase...</div>
  </div>

  <script>
    const container = document.getElementById('display-container');
    let fullPlaylist = [];
    let activePlaylist = [];
    let currentIndex = 0;
    let timer = null;

    // --- Formatação do Link ---
    function formatUrl(url) {
      if (!url) return '';
      let clean = url.trim();

      if (clean.includes('dropbox.com')) {
        return clean.replace('dl=0', 'raw=1').replace('dl=1', 'raw=1');
      }

      if (clean.includes('drive.google.com')) {
        const match = clean.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (match && match[1]) {
          return `https://drive.google.com/uc?export=view&id=${match[1]}`;
        }
      }

      return clean;
    }

    // --- Checagem de Horário Simplificada ---
    function isMediaActiveNow(item) {
      // Se não tem inicio OU não tem fim (ou são strings vazias/espacos), EXIBE O DIA TODO
      if (!item.horaInicio || !item.horaFim || item.horaInicio.trim() === "" || item.horaFim.trim() === "") {
        return true;
      }

      const now = new Date();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();

      const startParts = item.horaInicio.split(':');
      const endParts = item.horaFim.split(':');

      if (startParts.length < 2 || endParts.length < 2) return true;

      const startMinutes = parseInt(startParts[0], 10) * 60 + parseInt(startParts[1], 10);
      const endMinutes = parseInt(endParts[0], 10) * 60 + parseInt(endParts[1], 10);

      if (isNaN(startMinutes) || isNaN(endMinutes)) return true;

      if (startMinutes <= endMinutes) {
        return currentMinutes >= startMinutes && currentMinutes <= endMinutes;
      } else {
        return currentMinutes >= startMinutes || currentMinutes <= endMinutes;
      }
    }

    function updateActivePlaylist() {
      activePlaylist = fullPlaylist.filter(item => isMediaActiveNow(item));
    }

    // --- Conexão Firebase ---
    if (typeof database !== 'undefined') {
      database.ref('playlist').on('value', (snapshot) => {
        const data = snapshot.val();
        fullPlaylist = [];

        if (data) {
          Object.keys(data).forEach(key => {
            fullPlaylist.push({ id: key, ...data[key] });
          });
        }

        updateActivePlaylist();

        if (activePlaylist.length > 0) {
          showCurrentMedia();
        } else {
          clearTimeout(timer);
          container.innerHTML = '<div id="status-msg">Nenhuma mídia ativa no momento.</div>';
        }
      });
    } else {
      container.innerHTML = '<div id="status-msg">Erro: config.js não encontrado.</div>';
    }

    // --- Exibição ---
    function showCurrentMedia() {
      clearTimeout(timer);
      updateActivePlaylist();

      if (activePlaylist.length === 0) {
        container.innerHTML = '<div id="status-msg">Nenhuma mídia ativa no momento.</div>';
        timer = setTimeout(showCurrentMedia, 5000);
        return;
      }

      if (currentIndex >= activePlaylist.length) {
        currentIndex = 0;
      }

      const item = activePlaylist[currentIndex];
      const duration = (parseInt(item.tempo, 10) || 10) * 1000;
      const finalUrl = formatUrl(item.url);

      container.innerHTML = '';

      if (item.tipo === 'imagem') {
        const img = document.createElement('img');
        img.className = 'media-element fade-in';
        img.src = finalUrl;
        img.onerror = () => {
          console.warn("Erro ao carregar imagem, pulando:", finalUrl);
          nextMedia();
        };
        container.appendChild(img);

      } else if (item.tipo === 'video') {
        if (finalUrl.includes('youtube.com') || finalUrl.includes('youtu.be') || finalUrl.includes('drive.google.com')) {
          const iframe = document.createElement('iframe');
          iframe.src = finalUrl;
          iframe.className = 'media-element fade-in';
          iframe.allow = "autoplay; encrypted-media; fullscreen";
          container.appendChild(iframe);
        } else {
          const video = document.createElement('video');
          video.src = finalUrl;
          video.className = 'media-element fade-in';
          video.autoplay = true;
          video.muted = true;
          video.playsInline = true;
          video.onerror = () => nextMedia();
          container.appendChild(video);
        }
      }

      timer = setTimeout(nextMedia, duration);
    }

    function nextMedia() {
      updateActivePlaylist();
      if (activePlaylist.length > 0) {
        currentIndex = (currentIndex + 1) % activePlaylist.length;
      } else {
        currentIndex = 0;
      }
      showCurrentMedia();
    }
  </script>
</body>
</html>
