<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exibição em Tela Cheia</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
    }
    #display-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .media-element {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border: none;
      position: absolute;
      top: 0;
      left: 0;
    }
    #no-data {
      color: #fff;
      font-size: 1.5rem;
      text-align: center;
      z-index: 10;
    }
  </style>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="config.js"></script>
</head>
<body>

  <div id="display-container">
    <div id="no-data">Carregando mídias...</div>
  </div>

  <script>
    const container = document.getElementById('display-container');
    let playlist = [];
    let currentIndex = 0;
    let timer = null;

    // --- CONTADOR DE USUÁRIOS ONLINE ---
    const myPresenceRef = database.ref('online_users').push();
    myPresenceRef.set(true);
    myPresenceRef.onDisconnect().remove();

    // --- CARREGAMENTO E EXIBIÇÃO DE MÍDIAS ---
    database.ref('playlist').on('value', (snapshot) => {
      const data = snapshot.val();
      playlist = [];
      
      if (data) {
        Object.keys(data).forEach(key => {
          playlist.push(data[key]);
        });
      }

      if (playlist.length > 0) {
        if (currentIndex >= playlist.length) {
          currentIndex = 0;
        }
        showCurrentMedia();
      } else {
        clearTimeout(timer);
        container.innerHTML = '<div id="no-data">Nenhuma mídia cadastrada no momento.</div>';
      }
    });

    function showCurrentMedia() {
      clearTimeout(timer);
      if (playlist.length === 0) return;

      const item = playlist[currentIndex];
      const duration = (item.tempo || 10) * 1000;

      // Limpa o contêiner de forma segura sem quebrar referências do DOM
      while (container.firstChild) {
        container.removeChild(container.firstChild);
      }

      if (item.tipo === 'imagem') {
        const img = document.createElement('img');
        img.src = item.url;
        img.className = 'media-element';
        img.alt = 'Mídia';
        container.appendChild(img);
      } else if (item.tipo === 'video') {
        if (item.url.includes('youtube.com') || item.url.includes('drive.google.com')) {
          const iframe = document.createElement('iframe');
          iframe.src = item.url;
          iframe.className = 'media-element';
          iframe.allow = "autoplay; encrypted-media; fullscreen";
          iframe.allowFullscreen = true;
          container.appendChild(iframe);
        } else {
          // Trata como vídeo nativo (Dropbox, MP4 direto)
          const video = document.createElement('video');
          video.src = item.url;
          video.className = 'media-element';
          video.autoplay = true;
          video.muted = true; // Muted é obrigatório para Autoplay sem interação
          video.playsInline = true;
          video.controls = false;
          
          // Tenta dar play programaticamente
          video.play().catch(err => {
            console.warn("Autoplay bloqueado pelo navegador:", err);
          });

          container.appendChild(video);
        }
      }

      // Agenda a próxima mídia da lista
      timer = setTimeout(() => {
        currentIndex = (currentIndex + 1) % playlist.length;
        showCurrentMedia();
      }, duration);
    }
  </script>
</body>
</html>
