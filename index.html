<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exibição em Tela Cheia</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
    }
    #display-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .media-element {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border: none;
    }
    #no-data {
      color: #fff;
      font-size: 1.5rem;
      text-align: center;
    }
  </style>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="config.js"></script>
</head>
<body>

  <div id="display-container">
    <div id="no-data">Carregando mídias...</div>
  </div>

  <script>
    const container = document.getElementById('display-container');
    let playlist = [];
    let currentIndex = 0;
    let timer = null;

    // --- CONTADOR DE USUÁRIOS ONLINE ---
    const myPresenceRef = database.ref('online_users').push();
    myPresenceRef.set(true);
    myPresenceRef.onDisconnect().remove();

    // --- CARREGAMENTO E EXIBIÇÃO DE MÍDIAS ---
    database.ref('playlist').on('value', (snapshot) => {
      const data = snapshot.val();
      playlist = [];
      
      if (data) {
        Object.keys(data).forEach(key => {
          playlist.push(data[key]);
        });
      }

      if (playlist.length > 0) {
        currentIndex = 0;
        showCurrentMedia();
      } else {
        container.innerHTML = '<div id="no-data">Nenhuma mídia cadastrada no momento.</div>';
        clearTimeout(timer);
      }
    });

    function showCurrentMedia() {
      clearTimeout(timer);
      if (playlist.length === 0) return;

      const item = playlist[currentIndex];
      const duration = (item.tempo || 10) * 1000;

      if (item.tipo === 'imagem') {
        container.innerHTML = `<img src="${item.url}" class="media-element" alt="Mídia">`;
      } else if (item.tipo === 'video') {
        // Adiciona permissões avançadas ao iframe e o parâmetro de autoplay
        let videoUrl = item.url;
        if (!videoUrl.includes('autoplay=1')) {
          videoUrl += (videoUrl.includes('?') ? '&' : '?') + 'autoplay=1';
        }

        container.innerHTML = `
          <iframe 
            src="${videoUrl}" 
            class="media-element" 
            allow="autoplay; encrypted-media; fullscreen" 
            allowfullscreen
            frameborder="0">
          </iframe>`;
      }

      // Avança para o próximo item após o tempo configurado
      timer = setTimeout(() => {
        currentIndex = (currentIndex + 1) % playlist.length;
        showCurrentMedia();
      }, duration);
    }
  </script>
</body>
</html>
