<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player da TV com Notícias e Clima</title>
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
      position: relative;
    }

    /* ENVOLTÓRIO PRINCIPAL PARA PERMITIR ROTAÇÃO */
    #page-wrapper {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-color: #000;
      display: flex;
      flex-direction: column;
    }

    /* ROTAÇÃO 90 GRAUS (Modo Retrato / Totem) */
    .orientacao-90 {
      transform: rotate(90deg);
      transform-origin: center center;
      width: 100vh !important;
      height: 100vw !important;
      top: calc(50% - 50vw) !important;
      left: calc(50% - 50vh) !important;
    }

    /* ROTAÇÃO 270 GRAUS (Modo Retrato Invertido) */
    .orientacao-270 {
      transform: rotate(270deg);
      transform-origin: center center;
      width: 100vh !important;
      height: 100vw !important;
      top: calc(50% - 50vw) !important;
      left: calc(50% - 50vh) !important;
    }

    #display-container {
      width: 100%;
      height: calc(100% - 50px); /* Reserva espaço para a barra de notícias/clima */
      position: relative;
    }

    /* Duas camadas fixas para as mídias */
    .layer {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      transition: opacity 1.2s ease-in-out;
      z-index: 1;
      pointer-events: none;
    }
    .layer.active {
      opacity: 1 !important;
      z-index: 2 !important;
    }
    .layer img, .layer video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    #status-msg {
      color: #fff;
      font-size: 1.5rem;
      text-align: center;
      padding: 20px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      background: rgba(0,0,0,0.7);
      border-radius: 8px;
    }

    /* BOTÃO DE TELA CHEIA COMPACTO E DISCRETO */
    #fullscreen-btn {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.3);
      color: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      width: 32px;
      height: 32px;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      backdrop-filter: blur(2px);
    }
    #fullscreen-btn:hover {
      background: rgba(229, 9, 20, 0.8);
      color: #fff;
      border-color: #e50914;
      transform: scale(1.1);
    }

    /* BARRA DE NOTÍCIAS, RELÓGIO E CLIMA (TICKER FOOTER) */
    #news-bar {
      width: 100%;
      height: 50px;
      position: relative;
      background-color: #111;
      border-top: 3px solid #e50914;
      display: flex;
      align-items: center;
      overflow: hidden;
      z-index: 100;
    }
    .news-ticker-wrapper {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
    }
    .news-ticker-text {
      display: inline-block;
      white-space: nowrap;
      color: #fff;
      font-size: 1.1rem;
      padding-left: 100%;
      animation: ticker 45s linear infinite;
    }
    .news-item {
      display: inline-block;
      margin-right: 50px;
    }
    .news-item span {
      color: #ffcc00;
      margin-right: 10px;
    }

    /* WIDGET CLIMA E RELÓGIO FIXO À ESQUERDA */
    .widget-info {
      display: flex;
      align-items: center;
      height: 100%;
      background: #1a1a1a;
      border-right: 2px solid #222;
      padding: 0 15px;
      gap: 15px;
      z-index: 101;
      box-shadow: 2px 0 10px rgba(0,0,0,0.5);
    }
    .clima-box {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ffcc00;
      font-size: 0.95rem;
      font-weight: bold;
    }
    .relogio-box {
      color: #fff;
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 1px;
    }

    @keyframes ticker {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }
  </style>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="config.js"></script>
</head>
<body>

  <!-- Botão de Tela Cheia Pequeno -->
  <button id="fullscreen-btn" onclick="toggleFullscreen()" title="Alternar Tela Cheia">
    <span id="fs-icon">⛶</span>
  </button>

  <div id="page-wrapper">
    <div id="display-container">
      <div id="layer-a" class="layer"></div>
      <div id="layer-b" class="layer"></div>
      <div id="status-msg">Carregando mídias...</div>
    </div>

    <!-- Barra de Notícias, Clima e Relógio -->
    <div id="news-bar">
      <!-- Bloco de Clima e Relógio em Tempo Real na ESQUERDA -->
      <div class="widget-info">
        <div class="relogio-box" id="relogio">00:00</div>
        <div class="clima-box">
          <span id="clima-icone">☀️</span>
          <span id="clima-temp">--°C</span>
        </div>
      </div>

      <!-- Ticker de notícias rolando na DIREITA -->
      <div class="news-ticker-wrapper">
        <div id="news-ticker" class="news-ticker-text">Carregando últimas notícias de futebol e da Paraíba...</div>
      </div>
    </div>
  </div>

  <script>
    let firstMediaLoaded = false;

    // --- ROTAÇÃO DE TELA VIA URL ---
    const urlParams = new URLSearchParams(window.location.search);
    const MINHA_TV_ID = urlParams.get('tv') || 'todas';
    const ORIENTACAO = urlParams.get('orientacao') || '0';

    const pageWrapper = document.getElementById('page-wrapper');
    if (ORIENTACAO === '90') {
      pageWrapper.classList.add('orientacao-90');
    } else if (ORIENTACAO === '270') {
      pageWrapper.classList.add('orientacao-270');
    }

    // --- RELÓGIO EM TEMPO REAL ---
    function atualizarRelogio() {
      const agora = new Date();
      const horas = String(agora.getHours()).padStart(2, '0');
      const minutos = String(agora.getMinutes()).padStart(2, '0');
      document.getElementById('relogio').innerText = `${horas}:${minutos}`;
    }
    setInterval(atualizarRelogio, 1000);
    atualizarRelogio();

    // --- PREVISÃO DO TEMPO (CLIMA) VIA API ---
    function carregarClima() {
      // Coordenadas padrão: João Pessoa - PB (-7.1153, -34.861)
      const lat = -7.1153;
      const lon = -34.861;
      const urlClima = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`;

      fetch(urlClima)
        .then(res => res.json())
        .then(data => {
          if (data && data.current_weather) {
            const temp = Math.round(data.current_weather.temperature);
            const code = data.current_weather.weathercode;

            let icone = '☀️';
            if (code >= 1 && code <= 3) icone = '⛅';
            else if (code >= 45 && code <= 48) icone = '🌫️';
            else if (code >= 51 && code <= 67) icone = '🌧️';
            else if (code >= 80 && code <= 82) icone = '🌦️';
            else if (code >= 95) icone = '⛈️';

            document.getElementById('clima-temp').innerText = `${temp}°C`;
            document.getElementById('clima-icone').innerText = icone;
          }
        })
        .catch(err => console.warn("Erro ao buscar clima:", err));
    }
    carregarClima();
    setInterval(carregarClima, 15 * 60 * 1000); // Atualiza clima a cada 15 min

    // --- FUNÇÕES DE TELA CHEIA ---
    function openFullscreen() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
        const elem = document.documentElement;
        if (elem.requestFullscreen) {
          elem.requestFullscreen().catch(() => {});
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) {
          elem.msRequestFullscreen();
        }
      }
    }

    function toggleFullscreen() {
      const fsIcon = document.getElementById('fs-icon');

      if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
        openFullscreen();
        fsIcon.innerText = '🗗';
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        } else if (document.msExitFullscreen) {
          document.msExitFullscreen();
        }
        fsIcon.innerText = '⛶';
      }
    }

    document.addEventListener('fullscreenchange', () => {
      const fsIcon = document.getElementById('fs-icon');
      if (!document.fullscreenElement) {
        fsIcon.innerText = '⛶';
      } else {
        fsIcon.innerText = '🗗';
      }
    });

    // --- LÓGICA DO PLAYER E NOTÍCIAS ---
    const layerA = document.getElementById('layer-a');
    const layerB = document.getElementById('layer-b');
    const statusMsg = document.getElementById('status-msg');
    const newsTicker = document.getElementById('news-ticker');

    let playlist = [];
    let currentIndex = 0;
    let timer = null;
    let activeLayer = layerA;
    let inactiveLayer = layerB;
    let isTransitioning = false;

    // --- SISTEMA DE PRESENÇA EM TEMPO REAL E HEARTBEAT ---
    if (typeof database !== 'undefined') {
      const sessionKey = 'tv_' + MINHA_TV_ID;
      const tvRef = database.ref('tvs_online/' + sessionKey);
      const connectedRef = database.ref('.info/connected');

      function atualizarSinalVida() {
        tvRef.update({
          id: MINHA_TV_ID,
          orientacao: ORIENTACAO + 'deg',
          url: window.location.href,
          pagina: window.location.pathname + window.location.search,
          lastSeen: firebase.database.ServerValue.TIMESTAMP,
          vistoEm: firebase.database.ServerValue.TIMESTAMP
        });
      }

      connectedRef.on('value', (snap) => {
        if (snap.val() === true) {
          tvRef.onDisconnect().remove();
          atualizarSinalVida();
        }
      });

      setInterval(atualizarSinalVida, 15000);
    }

    // --- CARREGADOR DE FONTES DE NOTÍCIAS ---
    const fontesNoticias = [
      { nome: "GE - Futebol", url: "https://ge.globo.com/rss/ge/" },
      { nome: "GE - Paraíba Esporte", url: "https://ge.globo.com/rss/ge/pb/" },
      { nome: "Jornal da Paraíba", url: "https://www.jornaldaparaiba.com.br/feed/" },
      { nome: "Portal T5 - Paraíba", url: "https://www.portalt5.com.br/feed/" }
    ];

    let indiceFonteAtual = 0;

    function fetchNews() {
      const fonte = fontesNoticias[indiceFonteAtual];
      const rssUrl = encodeURIComponent(fonte.url);
      const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`;

      fetch(apiUrl)
        .then(response => response.json())
        .then(data => {
          if (data.status === 'ok' && data.items && data.items.length > 0) {
            const htmlNoticias = data.items.slice(0, 10).map(item => {
              return `<div class="news-item"><span>●</span> ${item.title}</div>`;
            }).join('');
            
            newsTicker.style.animation = 'none';
            newsTicker.offsetHeight;
            newsTicker.style.animation = 'ticker 45s linear infinite';

            newsTicker.innerHTML = htmlNoticias;
          }
        })
        .catch(err => {
          console.warn(`Erro ao carregar notícias de ${fonte.nome}:`, err);
        });

      indiceFonteAtual = (indiceFonteAtual + 1) % fontesNoticias.length;
    }

    fetchNews();
    setInterval(fetchNews, 2 * 60 * 1000);

    // --- REGISTRO DE MÉTRICAS NO FIREBASE ---
    function registrarMetricaExibicao(item, tempoEmSegundos) {
      if (typeof database === 'undefined' || !item || !item.empresaId) return;

      const hoje = new Date().toISOString().split('T')[0];
      const metricaRef = database.ref(`metricas/${hoje}/${item.empresaId}`);

      metricaRef.transaction((atual) => {
        if (!atual) {
          return {
            tempoTotalSegundos: tempoEmSegundos,
            vezesExibidas: 1
          };
        } else {
          return {
            tempoTotalSegundos: (atual.tempoTotalSegundos || 0) + tempoEmSegundos,
            vezesExibidas: (atual.vezesExibidas || 0) + 1
          };
        }
      });
    }

    // --- LÓGICA DO PLAYER ---
    function formatUrl(url, tipo) {
      if (!url) return '';
      let clean = url.trim();

      if (clean.includes('dropbox.com') || clean.includes('dropboxusercontent.com')) {
        try {
          let parsedUrl = new URL(clean);
          parsedUrl.hostname = 'dl.dropboxusercontent.com';
          parsedUrl.searchParams.set('raw', '1');
          parsedUrl.searchParams.delete('dl');
          return parsedUrl.toString();
        } catch (e) {
          return clean;
        }
      }

      if (clean.includes('drive.google.com') || clean.includes('docs.google.com')) {
        const idMatch = clean.match(/\/d\/([a-zA-Z0-9_-]+)/) || clean.match(/[?&]id=([a-zA-Z0-9_-]+)/);
        if (idMatch && idMatch[1]) {
          const id = idMatch[1];
          return tipo === 'imagem' 
            ? `https://lh3.googleusercontent.com/d/${id}`
            : `https://docs.google.com/uc?export=download&id=${id}`;
        }
      }

      return clean;
    }

    if (typeof database !== 'undefined') {
      database.ref('playlist').on('value', (snapshot) => {
        const data = snapshot.val();
        const todasMidias = data ? Object.values(data) : [];

        playlist = todasMidias.filter(item => {
          return !item.tvAlvo || item.tvAlvo === 'todas' || item.tvAlvo === MINHA_TV_ID;
        });

        if (playlist.length > 0) {
          if (!activeLayer.children.length && !inactiveLayer.children.length) {
            showMedia();
          }
        } else {
          clearTimeout(timer);
          statusMsg.style.display = 'block';
          statusMsg.innerText = `Nenhuma mídia agendada para esta TV (${MINHA_TV_ID}).`;
        }
      }, (error) => {
        console.error("Erro no Firebase Database:", error);
        statusMsg.innerText = "Erro ao carregar dados do Firebase.";
      });
    } else {
      statusMsg.innerText = "Erro: arquivo config.js não encontrado.";
    }

    function showMedia() {
      clearTimeout(timer);
      isTransitioning = false;

      if (playlist.length === 0) return;
      if (currentIndex >= playlist.length) currentIndex = 0;

      const item = playlist[currentIndex];
      const tempoSegundos = parseInt(item.tempo, 10) || 10;
      const duration = tempoSegundos * 1000;
      const finalUrl = formatUrl(item.url, item.tipo);

      inactiveLayer.innerHTML = '';
      let newElement;

      if (item.tipo === 'imagem') {
        newElement = document.createElement('img');
        newElement.src = finalUrl;
        
        newElement.onload = () => {
          registrarMetricaExibicao(item, tempoSegundos);
          switchLayers(newElement, duration);
        };
        newElement.onerror = () => nextMedia();
        inactiveLayer.appendChild(newElement);

      } else {
        newElement = document.createElement('video');
        newElement.muted = true;
        newElement.defaultMuted = true;
        newElement.setAttribute('muted', '');
        newElement.setAttribute('playsinline', '');
        newElement.setAttribute('webkit-playsinline', '');
        newElement.autoplay = true;
        newElement.preload = 'auto';

        let started = false;

        const startPlayback = () => {
          if (started) return;
          started = true;

          const playPromise = newElement.play();
          if (playPromise !== undefined) {
            playPromise.then(() => {
              registrarMetricaExibicao(item, tempoSegundos);
              switchLayers(newElement, duration);
            }).catch(() => {
              newElement.muted = true;
              newElement.play().then(() => {
                registrarMetricaExibicao(item, tempoSegundos);
                switchLayers(newElement, duration);
              }).catch(() => nextMedia());
            });
          } else {
            registrarMetricaExibicao(item, tempoSegundos);
            switchLayers(newElement, duration);
          }
        };

        newElement.onloadeddata = startPlayback;
        newElement.oncanplay = startPlayback;
        newElement.onerror = () => nextMedia();

        newElement.src = finalUrl;
        inactiveLayer.appendChild(newElement);

        setTimeout(() => {
          if (!started) nextMedia();
        }, 12000);
      }
    }

    function switchLayers(newElement, duration) {
      if (isTransitioning) return;
      isTransitioning = true;

      statusMsg.style.display = 'none';

      if (!firstMediaLoaded) {
        firstMediaLoaded = true;
        openFullscreen();
      }

      inactiveLayer.classList.add('active');
      activeLayer.classList.remove('active');

      const temp = activeLayer;
      activeLayer = inactiveLayer;
      inactiveLayer = temp;

      setTimeout(() => {
        const oldVideo = inactiveLayer.querySelector('video');
        if (oldVideo) {
          oldVideo.pause();
          oldVideo.removeAttribute('src');
          oldVideo.load();
        }
        inactiveLayer.innerHTML = '';
      }, 1300);

      clearTimeout(timer);
      timer = setTimeout(nextMedia, duration);
    }

    function nextMedia() {
      clearTimeout(timer);
      if (playlist.length > 0) {
        currentIndex = (currentIndex + 1) % playlist.length;
      }
      showMedia();
    }
  </script>
</body>
</html>
