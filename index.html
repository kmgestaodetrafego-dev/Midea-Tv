<script>
    let firstMediaLoaded = false;

    // --- ROTAÇÃO DE TELA VIA URL ---
    const urlParams = new URLSearchParams(window.location.search);
    const MINHA_TV_ID = urlParams.get('tv') || 'todas';
    const ORIENTACAO = urlParams.get('orientacao') || '0';

    const pageWrapper = document.getElementById('page-wrapper');
    if (pageWrapper) {
      if (ORIENTACAO === '90') {
        pageWrapper.classList.add('orientacao-90');
      } else if (ORIENTACAO === '270') {
        pageWrapper.classList.add('orientacao-270');
      }
    }

    // --- RELÓGIO DA BARRA SUPERIOR ---
    function atualizarRelogio() {
      const elRelogio = document.getElementById('relogio-celular');
      if (elRelogio) {
        const agora = new Date();
        const horas = String(agora.getHours()).padStart(2, '0');
        const minutos = String(agora.getMinutes()).padStart(2, '0');
        elRelogio.innerText = `${horas}:${minutos}`;
      }
    }
    setInterval(atualizarRelogio, 1000);
    atualizarRelogio();

    // --- PREVISÃO DO TEMPO NA BARRA SUPERIOR ---
    function carregarClima() {
      const lat = -7.1153;
      const lon = -34.861;
      const urlClima = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`;

      fetch(urlClima)
        .then(res => res.json())
        .then(data => {
          if (data && data.current_weather) {
            const temp = Math.round(data.current_weather.temperature);
            const code = data.current_weather.weathercode;

            let icone = '☀️';
            if (code >= 1 && code <= 3) icone = '⛅';
            else if (code >= 45 && code <= 48) icone = '🌫️';
            else if (code >= 51 && code <= 67) icone = '🌧️';
            else if (code >= 80 && code <= 82) icone = '🌦️';
            else if (code >= 95) icone = '⛈️';

            const elTemp = document.getElementById('clima-temp');
            const elIcone = document.getElementById('clima-icone');
            if (elTemp) elTemp.innerText = `${temp}°C`;
            if (elIcone) elIcone.innerText = icone;
          }
        })
        .catch(err => console.warn("Erro ao buscar clima:", err));
    }
    carregarClima();
    setInterval(carregarClima, 15 * 60 * 1000);

    // --- TELA CHEIA E OCULTAR BOTÃO ---
    function openFullscreen() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
        const elem = document.documentElement;
        if (elem.requestFullscreen) elem.requestFullscreen().catch(() => {});
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
        else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
        openFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.msExitFullscreen) document.msExitFullscreen();
      }
    }

    // MONITOR DE VISIBILIDADE DO BOTÃO
    function atualizarVisibilidadeBotaoFullscreen() {
      const btn = document.getElementById('fullscreen-btn');
      if (!btn) return;

      const isFullscreen = document.fullscreenElement || 
                           document.webkitFullscreenElement || 
                           document.mozFullScreenElement || 
                           document.msFullscreenElement;

      if (isFullscreen) {
        btn.style.display = 'none';
      } else {
        btn.style.display = 'flex';
      }
    }

    document.addEventListener('fullscreenchange', atualizarVisibilidadeBotaoFullscreen);
    document.addEventListener('webkitfullscreenchange', atualizarVisibilidadeBotaoFullscreen);
    document.addEventListener('mozfullscreenchange', atualizarVisibilidadeBotaoFullscreen);
    document.addEventListener('MSFullscreenChange', atualizarVisibilidadeBotaoFullscreen);

    // --- PLAYER & NOTÍCIAS ---
    const layerA = document.getElementById('layer-a');
    const layerB = document.getElementById('layer-b');
    const statusMsg = document.getElementById('status-msg');
    const newsTicker = document.getElementById('news-ticker');

    let playlist = [];
    let currentIndex = 0;
    let timer = null;
    let activeLayer = layerA;
    let inactiveLayer = layerB;
    let isTransitioning = false;

    // --- PRESENÇA NO FIREBASE ---
    if (typeof database !== 'undefined') {
      const sessionKey = 'tv_' + MINHA_TV_ID;
      const tvRef = database.ref('tvs_online/' + sessionKey);
      const connectedRef = database.ref('.info/connected');

      function atualizarSinalVida() {
        tvRef.update({
          id: MINHA_TV_ID,
          orientacao: ORIENTACAO + 'deg',
          url: window.location.href,
          pagina: window.location.pathname + window.location.search,
          lastSeen: firebase.database.ServerValue.TIMESTAMP,
          vistoEm: firebase.database.ServerValue.TIMESTAMP
        });
      }

      connectedRef.on('value', (snap) => {
        if (snap.val() === true) {
          tvRef.onDisconnect().remove();
          atualizarSinalVida();
        }
      });

      setInterval(atualizarSinalVida, 15000);
    }

    // --- FONTES DE NOTÍCIAS ---
    const fontesNoticias = [
      { nome: "GE - Futebol", url: "https://ge.globo.com/rss/ge/" },
      { nome: "GE - Paraíba Esporte", url: "https://ge.globo.com/rss/ge/pb/" },
      { nome: "Jornal da Paraíba", url: "https://www.jornaldaparaiba.com.br/feed/" },
      { nome: "Portal T5 - Paraíba", url: "https://www.portalt5.com.br/feed/" }
    ];

    let indiceFonteAtual = 0;

    function fetchNews() {
      if (!newsTicker) return;
      const fonte = fontesNoticias[indiceFonteAtual];
      const rssUrl = encodeURIComponent(fonte.url);
      const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`;

      fetch(apiUrl)
        .then(response => response.json())
        .then(data => {
          if (data.status === 'ok' && data.items && data.items.length > 0) {
            const htmlNoticias = data.items.slice(0, 10).map(item => {
              return `<div class="news-item"><span>●</span> ${item.title}</div>`;
            }).join('');
            
            newsTicker.style.animation = 'none';
            newsTicker.offsetHeight;
            newsTicker.style.animation = 'ticker 45s linear infinite';

            newsTicker.innerHTML = htmlNoticias;
          }
        })
        .catch(err => console.warn(`Erro ao carregar notícias de ${fonte.nome}:`, err));

      indiceFonteAtual = (indiceFonteAtual + 1) % fontesNoticias.length;
    }

    fetchNews();
    setInterval(fetchNews, 30 * 1000);

    // --- REGISTRO DE MÉTRICAS ---
    function registrarMetricaExibicao(item, tempoEmSegundos) {
      if (typeof database === 'undefined' || !item || !item.empresaId) return;

      const hoje = new Date().toISOString().split('T')[0];
      const metricaRef = database.ref(`metricas/${hoje}/${item.empresaId}`);

      metricaRef.transaction((atual) => {
        if (!atual) {
          return { tempoTotalSegundos: tempoEmSegundos, vezesExibidas: 1 };
        } else {
          return {
            tempoTotalSegundos: (atual.tempoTotalSegundos || 0) + tempoEmSegundos,
            vezesExibidas: (atual.vezesExibidas || 0) + 1
          };
        }
      });
    }

    // --- ROTAÇÃO DE MÍDIA ---
    function formatUrl(url, tipo) {
      if (!url) return '';
      let clean = url.trim();

      if (clean.includes('dropbox.com') || clean.includes('dropboxusercontent.com')) {
        try {
          let parsedUrl = new URL(clean);
          parsedUrl.hostname = 'dl.dropboxusercontent.com';
          parsedUrl.searchParams.set('raw', '1');
          parsedUrl.searchParams.delete('dl');
          return parsedUrl.toString();
        } catch (e) {
          return clean;
        }
      }

      if (clean.includes('drive.google.com') || clean.includes('docs.google.com')) {
        const idMatch = clean.match(/\/d\/([a-zA-Z0-9_-]+)/) || clean.match(/[?&]id=([a-zA-Z0-9_-]+)/);
        if (idMatch && idMatch[1]) {
          const id = idMatch[1];
          return tipo === 'imagem' 
            ? `https://lh3.googleusercontent.com/d/${id}`
            : `https://docs.google.com/uc?export=download&id=${id}`;
        }
      }

      return clean;
    }

    if (typeof database !== 'undefined') {
      database.ref('playlist').on('value', (snapshot) => {
        const data = snapshot.val();
        const todasMidias = data ? Object.values(data) : [];

        playlist = todasMidias.filter(item => {
          return !item.tvAlvo || item.tvAlvo === 'todas' || item.tvAlvo === MINHA_TV_ID;
        });

        if (playlist.length > 0) {
          if (activeLayer && !activeLayer.children.length && inactiveLayer && !inactiveLayer.children.length) {
            showMedia();
          }
        } else {
          clearTimeout(timer);
          if (statusMsg) {
            statusMsg.style.display = 'block';
            statusMsg.innerText = `Nenhuma mídia agendada para esta TV (${MINHA_TV_ID}).`;
          }
        }
      }, (error) => {
        console.error("Erro no Firebase Database:", error);
        if (statusMsg) statusMsg.innerText = "Erro ao carregar dados do Firebase.";
      });
    } else {
      if (statusMsg) statusMsg.innerText = "Erro: arquivo config.js não encontrado.";
    }

    function showMedia() {
      clearTimeout(timer);
      isTransitioning = false;

      if (!inactiveLayer || playlist.length === 0) return;
      if (currentIndex >= playlist.length) currentIndex = 0;

      const item = playlist[currentIndex];
      const tempoSegundos = parseInt(item.tempo, 10) || 10;
      const duration = tempoSegundos * 1000;
      const finalUrl = formatUrl(item.url, item.tipo);

      inactiveLayer.innerHTML = '';
      let newElement;

      if (item.tipo === 'imagem') {
        newElement = document.createElement('img');
        newElement.src = finalUrl;
        
        newElement.onload = () => {
          registrarMetricaExibicao(item, tempoSegundos);
          switchLayers(newElement, duration);
        };
        newElement.onerror = () => nextMedia();
        inactiveLayer.appendChild(newElement);

      } else {
        newElement = document.createElement('video');
        newElement.muted = true;
        newElement.defaultMuted = true;
        newElement.setAttribute('muted', '');
        newElement.setAttribute('playsinline', '');
        newElement.setAttribute('webkit-playsinline', '');
        newElement.autoplay = true;
        newElement.preload = 'auto';

        let started = false;

        const startPlayback = () => {
          if (started) return;
          started = true;

          const playPromise = newElement.play();
          if (playPromise !== undefined) {
            playPromise.then(() => {
              registrarMetricaExibicao(item, tempoSegundos);
              switchLayers(newElement, duration);
            }).catch(() => {
              newElement.muted = true;
              newElement.play().then(() => {
                registrarMetricaExibicao(item, tempoSegundos);
                switchLayers(newElement, duration);
              }).catch(() => nextMedia());
            });
          } else {
            registrarMetricaExibicao(item, tempoSegundos);
            switchLayers(newElement, duration);
          }
        };

        newElement.onloadeddata = startPlayback;
        newElement.oncanplay = startPlayback;
        newElement.onerror = () => nextMedia();

        newElement.src = finalUrl;
        inactiveLayer.appendChild(newElement);

        setTimeout(() => {
          if (!started) nextMedia();
        }, 12000);
      }
    }

    function switchLayers(newElement, duration) {
      if (isTransitioning || !activeLayer || !inactiveLayer) return;
      isTransitioning = true;

      if (statusMsg) statusMsg.style.display = 'none';

      if (!firstMediaLoaded) {
        firstMediaLoaded = true;
        openFullscreen();
      }

      inactiveLayer.classList.add('active');
      activeLayer.classList.remove('active');

      const temp = activeLayer;
      activeLayer = inactiveLayer;
      inactiveLayer = temp;

      setTimeout(() => {
        if (inactiveLayer) {
          const oldVideo = inactiveLayer.querySelector('video');
          if (oldVideo) {
            oldVideo.pause();
            oldVideo.removeAttribute('src');
            oldVideo.load();
          }
          inactiveLayer.innerHTML = '';
        }
      }, 1300);

      clearTimeout(timer);
      timer = setTimeout(nextMedia, duration);
    }

    function nextMedia() {
      clearTimeout(timer);
      if (playlist.length > 0) {
        currentIndex = (currentIndex + 1) % playlist.length;
      }
      showMedia();
    }
  </script>
