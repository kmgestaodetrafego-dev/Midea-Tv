<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player da TV</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
    }
    #display-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    .media-element {
      width: 100%;
      height: 100%;
      object-fit: contain;
      position: absolute;
      top: 0; 
      left: 0;
      opacity: 0;
      transition: opacity 1.2s ease-in-out;
      z-index: 1;
    }
    .media-element.active {
      opacity: 1;
      z-index: 2;
    }
    #status-msg {
      color: #fff;
      font-size: 1.5rem;
      text-align: center;
      padding: 20px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      background: rgba(0,0,0,0.7);
      border-radius: 8px;
    }
  </style>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="config.js"></script>
</head>
<body>

  <div id="display-container">
    <div id="status-msg">Carregando mídias...</div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const MINHA_TV_ID = urlParams.get('tv') || 'todas';

    const container = document.getElementById('display-container');
    const statusMsg = document.getElementById('status-msg');
    let playlist = [];
    let currentIndex = 0;
    let timer = null;

    // Converte links do Dropbox e Google Drive para acesso direto
    function formatUrl(url, tipo) {
      if (!url) return '';
      let clean = url.trim();

      // Dropbox (Força o download/stream direto)
      if (clean.includes('dropbox.com')) {
        return clean
          .replace('dl=0', 'raw=1')
          .replace('dl=1', 'raw=1')
          .replace('www.dropbox.com', 'dl.dropboxusercontent.com');
      }

      // Google Drive
      if (clean.includes('drive.google.com')) {
        const match = clean.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (match && match[1]) {
          const id = match[1];
          // Imagens usam CDN do Google User Content; vídeos usam uc?export=download
          return tipo === 'imagem' 
            ? `https://lh3.googleusercontent.com/d/${id}`
            : `https://docs.google.com/uc?export=download&id=${id}`;
        }
      }
      return clean;
    }

    if (typeof database !== 'undefined') {
      database.ref('playlist').on('value', (snapshot) => {
        const data = snapshot.val();
        const todasMidias = data ? Object.values(data) : [];

        playlist = todasMidias.filter(item => {
          return !item.tvAlvo || item.tvAlvo === 'todas' || item.tvAlvo === MINHA_TV_ID;
        });

        if (playlist.length > 0) {
          showMedia();
        } else {
          clearTimeout(timer);
          statusMsg.style.display = 'block';
          statusMsg.innerText = `Nenhuma mídia agendada para esta TV (${MINHA_TV_ID}).`;
        }
      }, (error) => {
        console.error("Erro no Firebase Database:", error);
        statusMsg.innerText = "Erro ao carregar dados do Firebase.";
      });
    } else {
      statusMsg.innerText = "Erro: arquivo config.js não encontrado.";
    }

    function showMedia() {
      clearTimeout(timer);

      if (playlist.length === 0) return;
      if (currentIndex >= playlist.length) currentIndex = 0;

      const item = playlist[currentIndex];
      const duration = (parseInt(item.tempo, 10) || 10) * 1000;
      const finalUrl = formatUrl(item.url, item.tipo);

      console.log(`Exibindo [${item.tipo}]:`, finalUrl);

      let newElement;

      if (item.tipo === 'imagem') {
        newElement = document.createElement('img');
        newElement.className = 'media-element';
        newElement.src = finalUrl;
        
        newElement.onload = () => startTransition(newElement, duration);
        newElement.onerror = () => {
          console.error("Erro ao carregar imagem:", finalUrl);
          nextMedia();
        };
      } else {
        newElement = document.createElement('video');
        newElement.className = 'media-element';
        newElement.autoplay = true;
        newElement.muted = true; // Necessário para permitir autoplay automático no PC
        newElement.playsInline = true;
        newElement.preload = 'auto';
        newElement.src = finalUrl;

        let started = false;
        const playVideo = () => {
          if (!started) {
            started = true;
            newElement.play().then(() => {
              startTransition(newElement, duration);
            }).catch((err) => {
              console.warn("Autoplay bloqueado. Forçando mudo e tentando novamente...", err);
              newElement.muted = true;
              newElement.play();
              startTransition(newElement, duration);
            });
          }
        };

        newElement.oncanplaythrough = playVideo;
        newElement.onloadeddata = playVideo;
        
        // Timeout de segurança (10s) caso o link do vídeo trave
        setTimeout(() => {
          if (!started) {
            console.warn("Timeout de carregamento do vídeo. Avançando para a próxima mídia.");
            nextMedia();
          }
        }, 10000);

        newElement.onerror = () => {
          console.error("Erro ao carregar vídeo:", finalUrl);
          nextMedia();
        };
      }

      container.appendChild(newElement);
    }

    function startTransition(newElement, duration) {
      const currentElement = container.querySelector('.media-element.active');

      requestAnimationFrame(() => {
        newElement.classList.add('active');
      });

      if (currentElement) {
        currentElement.classList.remove('active');
        setTimeout(() => {
          if (currentElement.parentNode === container) {
            if (currentElement.tagName === 'VIDEO') {
              currentElement.pause();
              currentElement.src = '';
              currentElement.load();
            }
            container.removeChild(currentElement);
          }
        }, 1200);
      }

      statusMsg.style.display = 'none';
      timer = setTimeout(nextMedia, duration);
    }

    function nextMedia() {
      if (playlist.length > 0) {
        currentIndex = (currentIndex + 1) % playlist.length;
      }
      showMedia();
    }
  </script>
</body>
</html>
