<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Midea TV Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* CONTAINER PRINCIPAL COM SUPORTE À ROTAÇÃO */
    #player-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.3s ease;
    }

    /* ROTAÇÃO VERTICAL (90 graus) */
    .orientacao-90 {
      transform: rotate(90deg);
      width: 100vh !important;
      height: 100vw !important;
    }

    /* ROTAÇÃO VERTICAL (270 graus) */
    .orientacao-270 {
      transform: rotate(270deg);
      width: 100vh !important;
      height: 100vw !important;
    }

    .media-element {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }

    .media-element.active {
      opacity: 1;
    }

    #loading {
      color: #fff;
      font-family: sans-serif;
      font-size: 1.5rem;
      text-align: center;
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="config.js"></script>
</head>
<body>

  <div id="player-container">
    <div id="loading">Carregando Midea TV...</div>
    <img id="img-display" class="media-element" alt="Mídia">
    <video id="video-display" class="media-element" autoplay muted playsinline></video>
  </div>

  <script>
    // PEGA PARÂMETROS DA URL (?tv=id_da_tv&orientacao=90)
    const urlParams = new URLSearchParams(window.location.search);
    const CURRENT_TV_ID = urlParams.get('tv') || 'geral';
    const ORIENTACAO = urlParams.get('orientacao') || '0';

    const playerContainer = document.getElementById('player-container');
    const imgDisplay = document.getElementById('img-display');
    const videoDisplay = document.getElementById('video-display');
    const loadingText = document.getElementById('loading');

    // APLICA ROTAÇÃO CONFORME PARÂMETRO
    if (ORIENTACAO === '90') {
      playerContainer.classList.add('orientacao-90');
    } else if (ORIENTACAO === '270') {
      playerContainer.classList.add('orientacao-270');
    }

    let playlist = [];
    let currentIndex = 0;
    let timer = null;

    // MARCA A TV COMO ONLINE NO FIREBASE
    function registrarTvOnline() {
      if (typeof database !== 'undefined') {
        const tvRef = database.ref('tvs_online/' + CURRENT_TV_ID);
        tvRef.set({
          id: CURRENT_TV_ID,
          orientacao: ORIENTACAO + 'deg',
          ultimaConexao: firebase.database.ServerValue.TIMESTAMP,
          url: window.location.href
        });

        // REMOVE O STATUS CASO A PÁGINA SEJA FECHADA
        tvRef.onDisconnect().remove();
      }
    }

    // CARREGA A PLAYLIST VINCULADA À TV OU GERAL
    function carregarPlaylist() {
      if (typeof database !== 'undefined') {
        database.ref('playlist').on('value', (snapshot) => {
          const data = snapshot.val();
          if (!data) {
            playlist = [];
            mostrarSemMidia();
            return;
          }

          // FILTRA AS MÍDIAS DA TV ESPECÍFICA OU GERAL ("todas")
          playlist = Object.values(data).filter(item => {
            return !item.tvAlvo || item.tvAlvo === 'todas' || item.tvAlvo === CURRENT_TV_ID;
          });

          if (playlist.length > 0) {
            currentIndex = 0;
            iniciarExibicao();
          } else {
            mostrarSemMidia();
          }
        });
      }
    }

    function mostrarSemMidia() {
      clearTimeout(timer);
      imgDisplay.classList.remove('active');
      videoDisplay.classList.remove('active');
      loadingText.style.display = 'block';
      loadingText.innerText = 'Aguardando mídias cadastradas...';
    }

    function iniciarExibicao() {
      if (playlist.length === 0) return;
      loadingText.style.display = 'none';

      clearTimeout(timer);
      const media = playlist[currentIndex];
      const tempoExibicao = (parseInt(media.tempo) || 10) * 1000;

      if (media.tipo === 'video') {
        imgDisplay.classList.remove('active');
        videoDisplay.src = media.url;
        videoDisplay.classList.add('active');
        
        videoDisplay.play().catch(e => console.log("Erro ao reproduzir vídeo:", e));

        videoDisplay.onended = () => proximaMidia();
        
        // TEMPO LIMITE DE SEGURANÇA CASO O VÍDEO TRAVE
        timer = setTimeout(() => proximaMidia(), tempoExibicao + 5000);
      } else {
        videoDisplay.classList.remove('active');
        videoDisplay.pause();
        
        imgDisplay.src = media.url;
        imgDisplay.classList.add('active');

        timer = setTimeout(() => proximaMidia(), tempoExibicao);
      }
    }

    function proximaMidia() {
      if (playlist.length === 0) return;
      currentIndex = (currentIndex + 1) % playlist.length;
      iniciarExibicao();
    }

    // INICIALIZAÇÃO
    window.onload = () => {
      registrarTvOnline();
      carregarPlaylist();
    };
  </script>
</body>
</html>
